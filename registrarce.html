    <main class="main-container">
        <section class="register-box animate__animated animate__fadeInUp">
            <h2>Crear Cuenta</h2>
            <form id="registerForm">
                <!-- Nombre -->
                <div class="form-group">
                    <label for="nombre" class="required">Nombre</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" required>
                </div>

                <!-- Apellido -->
                <div class="form-group">
                    <label for="apellido" class="required">Apellido</label>
                    <input type="text" id="apellido" name="apellido" placeholder="Ingresa tu apellido" required>
                </div>

                <!-- Correo -->
                <div class="form-group">
                    <label for="correo" class="required">Correo Electrónico</label>
                    <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
                </div>

                <!-- Documento -->
                <div class="form-group">
                    <label for="documento" class="required">Número de Documento</label>
                    <input type="text" id="documento" name="documento" placeholder="Ingresa tu número de documento" required>
                </div>

                <!-- Teléfono -->
                <div class="form-group">
                    <label for="telefono" class="optional">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="Ingresa tu teléfono (opcional)">
                </div>

                <!-- Género -->
                <div class="form-group">
                    <label for="id_genero" class="required">Género</label>
                    <select id="id_genero" name="id_genero" required>
                        <option value="" disabled selected>Selecciona tu género</option>
                    </select>
                </div>

                <!-- Institución -->
                <div class="form-group">
                    <label for="id_instituciones" class="optional">Institución</label>
                    <select id="id_instituciones" name="id_instituciones">
                        <option value="" selected>Selecciona una institución (opcional)</option>
                    </select>
                </div>

                <!-- Fecha de Nacimiento -->
                <div class="form-group">
                    <label for="fecha_nacimiento" class="optional">Fecha de Nacimiento</label>
                    <input type="date" id="fecha_nacimiento" name="fecha_nacimiento">
                </div>

                <!-- Contraseña -->
                <div class="form-group">
                    <label for="contrasena" class="required">Contraseña</label>
                    <div class="password-container">
                        <input type="password" id="contrasena" name="contrasena" placeholder="Crea una contraseña segura" required>
                        <button type="button" class="toggle-password" data-target="contrasena" aria-label="Mostrar/ocultar contraseña">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Confirmar Contraseña -->
                <div class="form-group">
                    <label for="confirmar_contrasena" class="required">Confirmar Contraseña</label>
                    <div class="password-container">
                        <input type="password" id="confirmar_contrasena" name="confirmar_contrasena" placeholder="Repite tu contraseña" required>
                        <button type="button" class="toggle-password" data-target="confirmar_contrasena" aria-label="Mostrar/ocultar contraseña">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="botones">
                    <button type="submit" class="btn-register">
                        <i class="fas fa-user-plus"></i>
                        Registrarse
                    </button>
                    <button type="button" class="btn-cancel" onclick="window.location.href='index.html'">
                        <i class="fas fa-times"></i>
                        Cancelar
                    </button>
                </div>

                <p class="login-link">
                    <a href="index.html">
                        <i class="fas fa-sign-in-alt"></i>
                        ¿Ya tienes cuenta? Inicia sesión aquí
                    </a>
                </p>
            </form>
        </section>
