<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parque de las Heliconias - Actividades</title>

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
    />
        <link rel="stylesheet" href="css/base/reset.css">
    <link rel="stylesheet" href="css/components/buttons.css">
    <link rel="stylesheet" href="css/pages/actividad.css">
    <link rel="stylesheet" href="css/components/hamburger.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
            <div class="top-section">
                <div class="logo">
                    <div class="logo-img">
                        <img src="img/logo.png" alt="Logo Heliconias" style="width:100%;height:100%;object-fit:contain;">
                    </div>
                    <h1>Heliconias Reports</h1>
                </div>
                    <!-- Navegación horizontal -->
                                                <button class="hamburger-btn" aria-label="Abrir menú">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
<nav class="main-nav">
                    <a href="principal.html" class="nav-item active tooltip">
                        <i class="fas fa-home"></i>
                        <span>Inicio</span>
                    </a>
                    <a href="eventos.html" class="nav-item tooltip">
                        <i class="fas fa-calendar-alt"></i>
                        <span>Eventos</span>
                    </a>
                    <a href="actividad.html" class="nav-item tooltip">
                        <i class="fas fa-hiking"></i>
                        <span>Actividades</span>
                    </a>
                    <a href="reportes.html" class="nav-item tooltip">
                        <i class="fas fa-chart-line"></i>
                        <span>Reportes</span>
                    </a>
                    <a href="configuracion.html" class="nav-item tooltip">
                        <i class="fas fa-cog"></i>
                        <span>Configuración</span>
                    </a>
                </nav>
            </div>
        </header>
        <!-- Menú móvil lateral (desliza de derecha a izquierda) -->
        <div class="mobile-overlay"></div>
        <aside class="mobile-sidebar">
            <div class="mobile-sidebar-header">
                <div class="logo">
                    <h1><img src="img/logo.png" alt="Logo Heliconias" style="width:100%;height:100%;object-fit:contain;"> Heliconias Reports</h1>
                </div>
                <button class="mobile-sidebar-close" aria-label="Cerrar menú">&times;</button>
            </div>
            <ul class="mobile-nav-list">
                <li><a href="principal.html" class="mobile-nav-item"><i class="fas fa-home"></i> Inicio</a></li>
                <li><a href="eventos.html" class="mobile-nav-item"><i class="fas fa-calendar-alt"></i> Eventos</a></li>
                <li><a href="actividad.html" class="mobile-nav-item"><i class="fas fa-hiking"></i> Actividades</a></li>
                <li><a href="reportes.html" class="mobile-nav-item"><i class="fas fa-chart-line"></i> Reportes</a></li>
                <li><a href="configuracion.html" class="mobile-nav-item"><i class="fas fa-cog"></i> Configuración</a></li>
            </ul>
            <div class="mobile-actions">
                <a href="soporte.html" class="btn btn-primary"><i class="fas fa-headset"></i> Soporte</a>
                <button class="btn btn-info" id="help-btn"><i class="fas fa-question-circle"></i> Ayuda</button>
                <button class="btn btn-accent" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Salir</button>
            </div>
        </aside>

        <div class="top-bar">
            <div class="system-date">
                <i class="fas fa-clock"></i>
                <span id="current-date-time">Cargando fecha y hora...</span>
            </div>

            <div class="user-actions">
                <a href="soporte.html" class="btn btn-primary tooltip">
                    <i class="fas fa-headset"></i> Soporte
                </a>

                <button class="btn btn-info tooltip" id="help-btn">
                    <i class="fas fa-question-circle"></i> Ayuda
                </button>

                <button class="btn btn-accent tooltip" id="logout-btn">
                    <i class="fas fa-sign-out-alt"></i> Salir
                </button>
            </div>
        </div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="page-title">
            <h2>Gestión de Actividades</h2>
        </div>

        <div class="search-container">
            <div class="search-box">
                <input type="text" id="search-input" class="search-input" placeholder="Buscar actividades por nombre...">
                <button id="search-btn" class="search-btn">
                    <i class="fas fa-search"></i> Buscar
                </button>
            </div>
        </div>

        <div class="activities-container">
            <div class="container-title">Todas las Actividades</div>
            <div id="activities-grid" class="activities-grid">
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i> Cargando actividades...
                </div>
            </div>
        </div>
    </main>

    <!-- Incluir Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Inicialización CORRECTA de Supabase -->
<script src="js/core/config.js"></script>
    <script src="js/pages/actividad/page/utils.js"></script>
<script src="js/pages/actividad/page/index.js"></script>
    <script src="js/core/nav-mobile.js"></script>
</body>
</html>
