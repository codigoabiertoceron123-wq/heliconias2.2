        <div class="nav-container">
          <!-- Navegación actualizada CON BOTÓN DE SOPORTE -->
                                    <button class="hamburger-btn" aria-label="Abrir menú">
                    <span></span>
                    <span></span>
                    <span></span>

<nav class="main-nav">
            <a href="#" class="nav-item" id="nav-inicio">

            <!-- NUEVO BOTÓN DE SOPORTE -->

          <!-- Ayuda -->

        <!-- Menú móvil lateral (desliza de derecha a izquierda) -->
        <div class="mobile-overlay"></div>
        <aside class="mobile-sidebar">
            <div class="mobile-sidebar-header">
                <div class="logo">
                    <h1><i class="fas fa-leaf"></i> Heliconias Reports</h1>
                </div>
                <button class="mobile-sidebar-close" aria-label="Cerrar menú">&times;</button>
            </div>
            <ul class="mobile-nav-list">
                <li><a href="principal.html" class="mobile-nav-item"><i class="fas fa-home"></i> Inicio</a></li>
                <li><a href="eventos.html" class="mobile-nav-item"><i class="fas fa-calendar-alt"></i> Eventos</a></li>

            </ul>

                <button class="btn btn-accent" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Salir</button>
            </div>
        </aside>


    <main class="main-container">
      <section class="login-box">
        <h2>Inicio de sesión</h2>
        <form id="loginForm">
          <fieldset>
            <div class="input-tooltip">
              <label for="nombre" class="tooltip">
                Usuario (Correo)
                <span class="tooltiptext">Ingresa tu correo registrado en el sistema</span>
              </label>
              <input
                type="text"
                id="nombre"
                name="nombre"
                placeholder="Tu nombre de usuario"
                required
                class="tooltip"
                title="Ejemplo: juan.perez o usuario123"
              />
            </div>

            <div class="input-tooltip">
              <label for="documento" class="tooltip">
                Contraseña
                <span class="tooltiptext">Ingresa tu contraseña de acceso al sistema</span>
              </label>
              <div class="password-container">
                <input
                  type="password"
                  id="documento"
                  name="documento"
                  placeholder="Tu contraseña"
                  required
                  class="tooltip"
                  title="Ingresa la contraseña que configuraste"
                />
                <i class="fa-solid fa-eye toggle-password" id="togglePassword"></i>
              </div>
            </div>

            <div class="botones">
              <button type="submit" class="tooltip" title="Haz clic para iniciar sesión en el sistema">
                Iniciar sesión
              </button>
            </div>

            <p class="forgot-password">
              <a href="contraseña.html" class="tooltip" title="Recuperar acceso si olvidaste tu documento">
                ¿Olvidaste tu Contraseña?
              </a>
              <br>
              <a href="registrarce.html" class="tooltip" style="margin-top: 10px; display: inline-block;" title="Crear una nueva cuenta en el sistema">
                ¿No tienes cuenta? Regístrate aquí
              </a>
            </p>
          </fieldset>
        </form>
      </section>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/pages/index/page/utils.js"></script>
<script src="js/pages/index/page/index.js"></script>
      <script src="js/core/nav-mobile.js"></script>
